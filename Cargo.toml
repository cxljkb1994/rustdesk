[package]
name = "linsdesk"
version = "1.4.1"
authors = ["rustdesk <info@rustdesk.com>"]
edition = "2021"
build= "build.rs"
description = "LinsDesk Remote Desktop"
default-run = "linsdesk"
rust-version = "1.75"

[lib]
name = "liblinsdesk"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "naming"
path = "src/naming.rs"

[[bin]]
name = "service"
path = "src/service.rs"

[features]
inline = []
cli = []
use_samplerate = ["samplerate"]
use_rubato = ["rubato"]
use_dasp = ["dasp"]
flutter = ["flutter_rust_bridge"]
default = ["use_dasp"]
hwcodec = ["scrap/hwcodec"]
vram = ["scrap/vram"]
mediacodec = ["scrap/mediacodec"]
plugin_framework = []
linux-pkg-config = ["magnum-opus/linux-pkg-config", "scrap/linux-pkg-config"]
unix-file-copy-paste = [
    "dep:x11-clipboard",
    "dep:x11rb",
    "dep:percent-encoding",
    "dep:once_cell",
    "clipboard/unix-file-copy-paste",
]
screencapturekit = ["cpal/screencapturekit"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1"
scrap = { path = "libs/scrap", features = ["wayland"] }
hbb_common = { path = "libs/hbb_common" }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
serde_repr = "0.1"
cfg-if = "1.0"
lazy_static = "1.4"
sha2 = "0.10"
repng = "0.2"
parity-tokio-ipc = { git = "https://github.com/rustdesk-org/parity-tokio-ipc" }
magnum-opus = { git = "https://github.com/rustdesk-org/magnum-opus" }
dasp = { version = "0.11", features = ["signal", "interpolate-linear", "interpolate"], optional = true }
rubato = { version = "0.12", optional = true }
samplerate = { version = "0.2", optional = true }
uuid = { version = "1.3", features = ["v4"] }
clap = "4.2"
rpassword = "7.2"
num_cpus = "1.15"
bytes = { version = "1.4", features = ["serde"] }
default-net = "0.14"
wol-rs = "1.0"
flutter_rust_bridge = { version = "=1.80", features = ["uuid"], optional = true}
errno = "0.3"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
url = { version = "2.3", features = ["serde"] }
crossbeam-queue = "0.3"
hex = "0.4"
chrono = "0.4"
cidr-utils = "0.5"
libloading = "0.8"
fon = "0.6"
zip = "0.6"
shutdown_hooks = "0.1"
totp-rs = { version = "5.4", default-features = false, features = ["gen_secret", "otpauth"] }
stunclient = "0.4"
kcp-sys= { git = "https://github.com/rustdesk-org/kcp-sys"}
# 注释掉非Linux平台的依赖，dev环境主要关注Windows
# [target.'cfg(not(target_os = "linux"))'.dependencies]
# # https://github.com/rustdesk/rustdesk/discussions/10197, not use cpal on linux
# cpal = { git = "https://github.com/rustdesk-org/cpal", branch = "osx-screencapturekit" }
# ringbuf = "0.3"

# Windows构建需要的音频依赖
[target.'cfg(target_os = "windows")'.dependencies.cpal]
git = "https://github.com/rustdesk-org/cpal"
branch = "osx-screencapturekit"
[target.'cfg(target_os = "windows")'.dependencies.ringbuf]
version = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mac_address = "1.1"
sciter-rs = { git = "https://github.com/rustdesk-org/rust-sciter", branch = "dyn" }
sys-locale = "0.3"
enigo = { path = "libs/enigo", features = [ "with_serde" ] }
clipboard = { path = "libs/clipboard" }
ctrlc = "3.2"
# arboard = { version = "3.4", features = ["wayland-data-control"] }
arboard = { git = "https://github.com/rustdesk-org/arboard", features = ["wayland-data-control"] }
clipboard-master = { git = "https://github.com/rustdesk-org/clipboard-master" }
portable-pty = { git = "https://github.com/rustdesk-org/wezterm", branch = "rustdesk/pty_based_0.8.1", package = "portable-pty" }

system_shutdown = "4.0"
qrcode-generator = "4.1"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "wincrypt",
    "shellscalingapi",
    "pdh",
    "synchapi",
    "memoryapi",
    "shellapi",
    "devguid",
    "setupapi",
    "cguid",
    "cfgmgr32",
    "ioapiset",
    "winspool",
] }
windows = { version = "0.61", features = [
    "Win32",
    "Win32_System",
    "Win32_System_Diagnostics",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
winreg = "0.11"
windows-service = "0.6"
virtual_display = { path = "libs/virtual_display" }
remote_printer = { path = "libs/remote_printer" }
impersonate_system = { git = "https://github.com/rustdesk-org/impersonate-system" }
shared_memory = "0.12"
tauri-winrt-notification = "0.1"
runas = "1.2"

# 注释掉macOS依赖，dev环境只构建Windows包
# [target.'cfg(target_os = "macos")'.dependencies]
# objc = "0.2"
# cocoa = "0.24"
# dispatch = "0.2"
# core-foundation = "0.9"
# core-graphics = "0.22"
# include_dir = "0.7"
# fruitbasket = "0.10"
# objc_id = "0.1"

# 注释掉跨平台依赖，dev环境只保留Windows必需的
# [target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
# tray-icon = { git = "https://github.com/tauri-apps/tray-icon" }
# tao = { git = "https://github.com/rustdesk-org/tao", branch = "dev" }
# image = "0.24"

# Windows专用的托盘和窗口依赖
[target.'cfg(target_os = "windows")'.dependencies.tray-icon]
git = "https://github.com/tauri-apps/tray-icon"
[target.'cfg(target_os = "windows")'.dependencies.tao]
git = "https://github.com/rustdesk-org/tao"
branch = "dev"
[target.'cfg(target_os = "windows")'.dependencies.image]
version = "0.24"

# 注释掉macOS和Linux的keepawake依赖
# [target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# keepawake = { git = "https://github.com/rustdesk-org/keepawake-rs" }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
wallpaper = { git = "https://github.com/rustdesk-org/wallpaper.rs" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# https://github.com/rustdesk/rustdesk-server-pro/issues/189, using native-tls for better tls support
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "native-tls", "gzip"], default-features=false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features=false }

# 注释掉Linux依赖，dev环境只构建Windows包
# [target.'cfg(target_os = "linux")'.dependencies]
# psimple = { package = "libpulse-simple-binding", version = "2.27" }
# pulse = { package = "libpulse-binding", version = "2.27" }
# rust-pulsectl = { git = "https://github.com/rustdesk-org/pulsectl" }
# async-process = "1.7"
# evdev = { git="https://github.com/rustdesk-org/evdev" }
# dbus = "0.9"
# dbus-crossroads = "0.5"
# pam = { git="https://github.com/rustdesk-org/pam" }
# users = { version = "0.11" }
# x11-clipboard = {git="https://github.com/clslaid/x11-clipboard", branch = "feat/store-batch", optional = true}
# x11rb =  {version = "0.12", features = ["all-extensions"], optional = true}
# percent-encoding = {version = "2.3", optional = true}
# once_cell = {version = "1.18", optional = true}
# nix = { version = "0.29", features = ["term", "process"]}
# gtk = "0.18"
# termios = "0.3"
# terminfo = "0.8"

# 注释掉Android依赖，dev环境只构建Windows包
# [target.'cfg(target_os = "android")'.dependencies]
# android_logger = "0.13"
# jni = "0.21"
# android-wakelock = { git = "https://github.com/rustdesk-org/android-wakelock" }

# dev环境工作空间，只包含Windows构建必需的库
[workspace]
members = [
    "libs/scrap", 
    "libs/hbb_common", 
    "libs/enigo", 
    "libs/clipboard", 
    "libs/virtual_display", 
    "libs/virtual_display/dylib", 
    "libs/portable", 
    "libs/remote_printer"
]
exclude = ["vdi/host", "examples/custom_plugin"]
# 注释：所有库都保留，因为即使在Windows构建中也可能需要

[package.metadata.winres]
LegalCopyright = "Copyright  2025 Purslane Ltd. All rights reserved."
ProductName = "LinsDesk"
FileDescription = "LinsDesk Remote Desktop"
OriginalFilename = "linsdesk.exe"

[target.'cfg(target_os="windows")'.build-dependencies]
winres = "0.1"
winapi = { version = "0.3", features = [ "winnt", "pdh", "synchapi" ] }

[build-dependencies]
cc = "1.0"
hbb_common = { path = "libs/hbb_common" }
os-version = "0.2"

[dev-dependencies]
hound = "3.5"
docopt = "1.1"

[package.metadata.bundle]
name = "LinsDesk"
identifier = "com.carriez.linsdesk"
icon = ["res/32x32.png", "res/128x128.png", "res/128x128@2x.png"]
osx_minimum_system_version = "10.14"

#https://github.com/johnthagen/min-sized-rust
[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip
rpath = true
